# 定时拉取官方仓库源码，编译 apps/desktop，产出 Windows NSIS 安装程序，
# 上传 artifacts 并创建对应的 GitHub Release。
#
# 编译完全基于官方源码：使用官方仓库自身的打包脚本与锁定依赖，不修改任何源码文件。
# 唯一偏离官方发布流程的地方是「不签名」（unsigned），因为本仓库不持有代码签名证书。
name: Build DeepSeek Harness Windows installer

on:
  schedule:
    # 每 2 小时运行一次（UTC）。没有要构建的新版本时，check job 在 Ubuntu 上快速结束，
    # build job 显示为 skipped。
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建最新的上游发行版（会先删除同名旧发行版）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dsh-desktop-exe
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # 判定交付物：在上游发行版中选出「上游已有、本仓库还没有」的最新一个。
  check:
    name: Find an upstream release to build
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.select.outputs.skip }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
      commit: ${{ steps.select.outputs.commit }}
      title: ${{ steps.select.outputs.title }}
      prerelease: ${{ steps.select.outputs.prerelease }}
    steps:
      - name: Select the newest upstream release this repository lacks
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 上游最近 40 个发行版（含预发布，排除草稿），按创建时间倒序。
          upstream=$(gh release list -R "$UPSTREAM_REPOSITORY" --limit 40 \
            --json tagName,name,isPrerelease,isDraft,createdAt |
            jq -c '[.[] | select(.isDraft | not)] | sort_by(.createdAt) | reverse')
          # 本仓库已有的发行版标签。上游与本仓库使用同一套标签命名（dsh-v<版本>）。
          mine=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName |
            jq -c '[.[].tagName]')

          if [ '${{ inputs.force }}' = 'true' ]; then
            # 强制模式：忽略本项目已有发行版，直接取上游最新一个。
            chosen=$(jq -c 'first // empty' <<<"$upstream")
          else
            chosen=$(jq -c --argjson mine "$mine" \
              'map(select(.tagName as $t | ($mine | index($t)) == null)) | first // empty' <<<"$upstream")
          fi

          if [ -z "$chosen" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "上游没有本仓库尚未构建的发行版，跳过本次构建。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tag=$(jq -r '.tagName' <<<"$chosen")
          name=$(jq -r '.name // ""' <<<"$chosen")
          prerelease=$(jq -r '.isPrerelease' <<<"$chosen")

          if [[ ! "$tag" =~ ^dsh-v(.+)$ ]]; then
            echo "::error::unexpected upstream tag: $tag"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          commit=$(gh api "repos/$UPSTREAM_REPOSITORY/commits/$tag" --jq .sha)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot resolve commit for $tag"
            exit 1
          fi

          # 版本号必须与上游在该提交处的 package.json 一致，不一致就停下而不是猜。
          declared=$(gh api "repos/$UPSTREAM_REPOSITORY/contents/package.json?ref=$commit" \
            -H 'Accept: application/vnd.github.raw' | jq -r .version)
          if [ "$declared" != "$version" ]; then
            echo "::error::tag $tag implies $version but package.json declares $declared"
            exit 1
          fi

          [ -n "$name" ] || name="v$version"

          {
            echo "skip=false"
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$commit"
            echo "title=$name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          {
            echo "选定上游发行版：**$name**（\`$tag\`）"
            echo ""
            echo "| 上游版本 | 上游提交 | 预发布 |"
            echo "| --- | --- | --- |"
            echo "| $version | $commit | $prerelease |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build unsigned Windows installer
    needs: check
    # 没有新版本时整个构建 job 显示为 skipped，工作流不会因此失败。
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. 克隆官方源码并检出该发行版对应的提交
      # ------------------------------------------------------------------
      - name: Clone upstream source at the released commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 完整克隆：官方 release 脚本需要读取仓库标签。
          git clone --quiet "https://github.com/$env:UPSTREAM_REPOSITORY.git" source
          git -C source checkout --quiet --detach '${{ needs.check.outputs.commit }}'

          $head = (git -C source rev-parse HEAD).Trim()
          if ($head -ne '${{ needs.check.outputs.commit }}') { throw "checkout mismatch: $head" }
          Write-Host "checked out $head"

      # ------------------------------------------------------------------
      # 2. 写入桌面端打包所需的发布设置
      #    官方打包脚本只从 apps/desktop/.env.windows 读取这些值（并剥离同名环境变量）。
      # ------------------------------------------------------------------
      - name: Write desktop release settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 可在仓库 Variables 中覆盖这两项，未设置时使用默认值。
          $appId = '${{ vars.DSH_DESKTOP_APP_ID }}'
          if ([string]::IsNullOrWhiteSpace($appId)) { $appId = 'com.deepseek.harness' }
          $policyOrigin = '${{ vars.DSH_MANDATORY_UPDATE_ORIGIN }}'
          if ([string]::IsNullOrWhiteSpace($policyOrigin)) { $policyOrigin = 'https://example.com' }

          $settings = @(
            '# Generated by .github/workflows/build-desktop-exe.yml.',
            '# Upstream template: apps/desktop/.env.windows.example',
            "DSH_DESKTOP_APP_ID=$appId",
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production',
            "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=$policyOrigin"
          )
          Set-Content -Path source/apps/desktop/.env.windows -Value $settings -Encoding utf8
          Get-Content -Path source/apps/desktop/.env.windows | ForEach-Object { Write-Host $_ }

      # ------------------------------------------------------------------
      # 3. 使用官方仓库声明的工具链版本安装依赖并打包
      # ------------------------------------------------------------------
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Package Windows installer (unsigned)
        id: package
        working-directory: source
        shell: pwsh
        # 官方命令原样执行。打包末尾会跑冒烟检查（含 LibreOffice 文档转换），
        # 该检查在 GitHub 托管 runner 上失败；此处保留真实退出码，由下一步判定。
        continue-on-error: true
        env:
          # 记录构建来源提交，使安装包内的构建元数据可回溯到官方源码。
          DSH_DESKTOP_BUILD_COMMIT: ${{ needs.check.outputs.commit }}
          DSH_DESKTOP_BUILD_DIRTY: '0'
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:GITHUB_WORKSPACE 'packaging.log'
          pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned 2>&1 |
            Tee-Object -FilePath $log
          Write-Host "packaging exit code: $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Verify the packaging outcome
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outcome = '${{ steps.package.outcome }}'
          $log = Join-Path $env:GITHUB_WORKSPACE 'packaging.log'
          $directory = 'source/.desktop-build/targets/win-x64/unsigned-artifacts'
          $note = ''

          if ($outcome -ne 'success') {
            $text = if (Test-Path -LiteralPath $log) { Get-Content -Raw -LiteralPath $log } else { '' }
            # 只容忍这一处已知失败（GitHub 托管 runner 上 LibreOffice 原生转换异常）；
            # 除此之外的任何失败仍然让构建失败。
            if ($text -notmatch 'desktop runtime: docx conversion failed') {
              throw 'packaging failed for a reason other than the Office smoke check; see the packaging log artifact'
            }
            $exe = @(Get-ChildItem -LiteralPath $directory -Filter '*.exe' -File -ErrorAction SilentlyContinue)
            if ($exe.Count -ne 1) {
              throw "the Office smoke check failed and no installer was produced in $directory"
            }
            $note = '打包末尾的 Office 文档转换冒烟检查在 GitHub 托管 runner 上失败（LibreOfficeKit 原生转换异常）；安装程序已正常产出，其余运行时检查均通过。'
            Write-Warning $note
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "> [!NOTE]`n> $note"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "smoke_note=$note"

      # ------------------------------------------------------------------
      # 4. 校验产物并生成校验和
      # ------------------------------------------------------------------
      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = 'source/.desktop-build/targets/win-x64/unsigned-artifacts'
          $exe = @(Get-ChildItem -LiteralPath $directory -Filter '*.exe' -File)
          if ($exe.Count -ne 1) {
            throw "expected exactly one installer in $directory, found $($exe.Count)"
          }
          $name = $exe[0].Name
          if ($name -notlike '*unsigned*') { throw "unexpected artifact name: $name" }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe[0].FullName).Hash.ToLower()
          Set-Content -Path SHA256SUMS.txt -Encoding utf8 -Value "$hash  $name"

          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value @(
            "file=$name",
            "sha256=$hash"
          )
          Write-Host "$name`nsha256: $hash"

          $summary = @(
            '',
            '| 上游版本 | 上游提交 | 安装程序 | SHA-256 |',
            '| --- | --- | --- | --- |',
            "| ${{ needs.check.outputs.version }} | ${{ needs.check.outputs.commit }} | $name | $hash |"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value $summary

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64-unsigned-${{ needs.check.outputs.version }}
          path: |
            source/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            SHA256SUMS.txt
            packaging.log
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------
      # 5. 生成发行说明并创建发行版
      # ------------------------------------------------------------------
      - name: Compose release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # gh 输出经控制台编码解码，固定为 UTF-8 以免中文发行说明被破坏。
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $OutputEncoding = [Text.Encoding]::UTF8

          $lines = @(
            '> **本发行版由第三方自动化流水线自行编译，非 DeepSeek 官方发布。**',
            '>',
            "> 安装程序直接由官方仓库 [deepseek-ai/deepseek-harness](https://github.com/$env:UPSTREAM_REPOSITORY) 的源码编译生成，",
            '> 未修改任何源码，使用官方仓库自身的打包脚本与锁定依赖。构建产物未进行代码签名。',
            '',
            '| 项目 | 值 |',
            '| --- | --- |',
            "| 上游版本 | ${{ needs.check.outputs.version }} |",
            "| 上游标签 | ${{ needs.check.outputs.tag }} |",
            "| 上游提交 | ${{ needs.check.outputs.commit }} |",
            '| 目标平台 | Windows x64（NSIS 安装程序） |',
            "| 安装程序 | ${{ steps.collect.outputs.file }} |",
            "| SHA-256 | ${{ steps.collect.outputs.sha256 }} |",
            '| 代码签名 | 无（unsigned 构建） |',
            '',
            '> [!WARNING]',
            '> 该安装程序未签名，Windows SmartScreen 会给出警告；应用内自动更新不可用。',
            '',
            '<details>',
            "<summary>官方原始发行说明（${{ needs.check.outputs.tag }}）</summary>",
            ''
          )
          Set-Content -Path release-notes.md -Value $lines -Encoding utf8

          $official = @(gh api "repos/$env:UPSTREAM_REPOSITORY/releases/tags/${{ needs.check.outputs.tag }}" --jq '.body')
          Add-Content -Path release-notes.md -Value $official -Encoding utf8
          Add-Content -Path release-notes.md -Encoding utf8 -Value @('', '</details>')

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ needs.check.outputs.tag }}'

          # 强制重建时先删除旧发行版及其标签，随后按全新流程创建。
          if [ '${{ inputs.force }}' = 'true' ] &&
             gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          args=(release create "$tag"
            --repo "$GITHUB_REPOSITORY"
            --title '${{ needs.check.outputs.title }}'
            --notes-file release-notes.md
            --target "$GITHUB_SHA")
          if [ '${{ needs.check.outputs.prerelease }}' = 'true' ]; then
            args+=(--prerelease)
          fi
          args+=("source/.desktop-build/targets/win-x64/unsigned-artifacts/${{ steps.collect.outputs.file }}"
            SHA256SUMS.txt)

          gh "${args[@]}"
